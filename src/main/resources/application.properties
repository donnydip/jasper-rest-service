spring.application.name=jasper-service

# Main Spring Datasource (not used by the async service but good practice to keep)
spring.datasource.url=jdbc:postgresql://postgres:5432/jasperservice
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ===================================================================
# Named Datasource Connections for Dynamic Report Generation
# ===================================================================
datasource.connections.web001.url=jdbc:postgresql://postgres:5432/db_for_app1
datasource.connections.web001.username=user_app1
datasource.connections.web001.password=pass_app1
datasource.connections.web001.driver-class-name=org.postgresql.Driver

datasource.connections.web002.url=jdbc:postgresql://some_other_host:5432/db_for_app2
datasource.connections.web002.username=user_app2
datasource.connections.web002.password=pass_app2
datasource.connections.web002.driver-class-name=org.postgresql.Driver

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# JasperReports Configuration
spring.jasper.reports.resource-location=file:/app/src/main/resources/reports/
report.output.dir=/app/generated-reports

# ===================================================================
# SpringDoc OpenAPI / Swagger UI Configuration
# ===================================================================
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.path=/api-docs

