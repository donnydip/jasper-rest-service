spring.application.name=jasper-service

# Main Spring Datasource (not used by the async service but good practice to keep)
spring.datasource.url=jdbc:postgresql://postgres:5432/jasperservice
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ===================================================================
# Named Datasource Connections for Dynamic Report Generation
# ===================================================================
datasource.connections.web001.url=${DS_WEB001_URL:jdbc:postgresql://localhost:5432/db_app1}
datasource.connections.web001.username=${DS_WEB001_USER:user_app1}
datasource.connections.web001.password=${DS_WEB001_PASS}
datasource.connections.web001.driver-class-name=org.postgresql.Driver

datasource.connections.web002.url=${DS_WEB002_URL:jdbc:postgresql://some_other_host:5432/db_for_app2}
datasource.connections.web002.username=${DS_WEB002_USER:user_app2}
datasource.connections.web002.password=${DS_WEB002_PASS}
datasource.connections.web002.driver-class-name=org.postgresql.Driver

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# JasperReports Configuration
spring.jasper.reports.resource-location=file:/app/src/main/resources/reports/
report.output.dir=/app/generated-reports

# ===================================================================
# SpringDoc OpenAPI / Swagger UI Configuration
# ===================================================================
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.path=/api-docs

# ===================================================================
# Spring Boot Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ===================================================================
# Rate Limiting Configuration
# ===================================================================
rate-limit.requests-per-minute=10
rate-limit.enabled=true

